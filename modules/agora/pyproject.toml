[project]
name = "d2-agora"
version = "0.1.0"
description = "Agora: the agenda forum. Ideas, one upvote per participant, a queue ranked by scope tier (Democracy2.0)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["d2-charter"]

[project.scripts]
d2-agora = "d2_agora.__main__:main"

[tool.uv.sources]
d2-charter = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_agora"]
