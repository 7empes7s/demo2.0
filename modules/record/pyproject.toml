[project]
name = "d2-record"
version = "0.1.0"
description = "Record: an append-only, verifiable public log with signed checkpoints and Bitcoin anchoring (Democracy2.0)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.scripts]
d2-record = "d2_record.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_record"]
