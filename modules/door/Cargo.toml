[package]
name = "d2-door"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Door: state identity in, unlinkable anonymous credential out (protocol core, unaudited)"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "d2_door"
path = "src/lib.rs"

[[bin]]
name = "d2-door"
path = "src/bin/d2-door.rs"

[dependencies]
# BBS (IRTF CFRG BBS draft 12), blind BBS and per-verifier pseudonyms, over BLS12-381.
zkryptium = { version = "0.7.1", default-features = false, features = ["bbsplus", "bbsplus_blind", "bbsplus_nym"] }
# OPRF (RFC 9497), ristretto255 with SHA-512.
voprf = { version = "0.5.0", default-features = false, features = ["ristretto255-ciphersuite", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
