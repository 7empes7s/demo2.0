[project]
name = "d2-provenance"
version = "0.1.0"
description = "Provenance: grades factual claims green, yellow or red against open records (Democracy2.0)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
d2-provenance = "d2_provenance.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_provenance"]
