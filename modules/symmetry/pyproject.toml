[project]
name = "d2-symmetry"
version = "0.1.0"
description = "Symmetry: a harness that measures whether a persuasive AI pushes back equally hard in every direction."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
d2-symmetry = "d2_symmetry.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_symmetry"]
