[project]
name = "d2-booth-verify"
version = "0.1.0"
description = "Independent verifier for Booth ballot boards, written from spec/booth (Democracy2.0)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pynacl>=1.5,<2"]

[project.scripts]
d2-booth-verify = "d2_booth_verify.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_booth_verify"]
