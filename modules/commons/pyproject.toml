[project]
name = "d2-commons"
version = "0.2.0"
description = "Commons: the argument library and its bridging ranker (Democracy2.0)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
d2-commons = "d2_commons.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_commons"]
