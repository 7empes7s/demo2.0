[project]
name = "d2-docket"
version = "0.1.0"
description = "Docket: official Luxembourg sources (bills, agendas, documents), normalized (Democracy2.0)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "pypdf>=5"]

[project.scripts]
d2-docket = "d2_docket.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_docket"]
