name: Merge gate

# Merges PRs labelled `automerge` once they are safe. It works on the free GitHub plan,
# where private repos get no branch protection. See tools/merge-gate.sh for the rules.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: merge-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  gate:
    name: Merge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always run the default branch's copy, so a PR can't change the gate that judges it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Merge ready PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # Set the repo variable REQUIRE_REVIEW=true once an independent reviewer (Codex) is on.
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW }}
        run: tools/merge-gate.sh
