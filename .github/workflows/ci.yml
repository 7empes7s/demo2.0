name: CI

# The one required check. It runs tools/check.sh, which each repo fills in with its own
# lint, typecheck, build and tests. Keep the job name stable: the merge gate looks for this workflow.
on:
  pull_request:
  push:
    branches: [main, master]
  # The merge gate dispatches this after a merge, because merges made with GITHUB_TOKEN don't
  # start push workflows. Auto-deploy only ships default-branch commits with a green CI run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up
        run: tools/dev-setup.sh
      - name: Check
        run: tools/check.sh
