[project]
name = "d2-charter"
version = "0.1.0"
description = "Charter and Scope: the rules of the game as versioned data, and a matter's tier (Democracy2.0)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2_charter"]
